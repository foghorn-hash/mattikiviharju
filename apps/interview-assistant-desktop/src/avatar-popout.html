<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveAvatar - Jaettava näkymä</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #popout-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <canvas id="popout-canvas"></canvas>
  <div class="badge" id="popout-badge">LIVEAVATAR • VALMIUSTILASSA</div>

  <script>
    const canvas = document.getElementById('popout-canvas');
    const ctx = canvas.getContext('2d');
    const badge = document.getElementById('popout-badge');
    let isSpeaking = false;
    let mouthOpen = 0;
    let blinkPhase = 0;
    let headAngle = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.api.onAvatarSpeakingState((speaking) => {
      isSpeaking = speaking;
      badge.textContent = speaking ? 'LIVEAVATAR • PUHUU' : 'LIVEAVATAR • VALMIUSTILASSA';
      badge.style.color = speaking ? '#10b981' : '#94a3b8';
    });

    window.api.onAvatarVisemeUpdate((data) => {
      if (data && typeof data.mouthOpen === 'number') {
        mouthOpen = data.mouthOpen;
      }
    });

    // Render loop
    function drawAvatar() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Deep studio background with subtle vignette
      const bgGrad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, Math.max(w, h)/1.2);
      bgGrad.addColorStop(0, '#1e293b');
      bgGrad.addColorStop(1, '#090d16');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2 - 20;
      const scale = Math.min(w, h) / 380;

      // Subtle breathing / head sway
      const time = Date.now() * 0.002;
      headAngle = Math.sin(time) * 0.02;
      const breath = Math.sin(time * 0.8) * 3;

      ctx.save();
      ctx.translate(cx, cy + breath);
      ctx.rotate(headAngle);
      ctx.scale(scale, scale);

      // Shoulders / Suit jacket
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(0, 160, 140, 70, 0, 0, Math.PI * 2);
      ctx.fill();

      // Shirt collar
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(-35, 100);
      ctx.lineTo(0, 130);
      ctx.lineTo(35, 100);
      ctx.lineTo(25, 115);
      ctx.lineTo(0, 140);
      ctx.lineTo(-25, 115);
      ctx.closePath();
      ctx.fill();

      // Neck
      ctx.fillStyle = '#f6d8b8';
      ctx.fillRect(-22, 50, 44, 60);

      // Head / Face
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.ellipse(0, 10, 65, 80, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = '#262626';
      ctx.beginPath();
      ctx.arc(0, -20, 68, Math.PI, 0);
      ctx.fill();

      // Eyebrows
      ctx.strokeStyle = '#1c1917';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-45, -25);
      ctx.quadraticCurveTo(-25, -35, -10, -26);
      ctx.moveTo(10, -26);
      ctx.quadraticCurveTo(25, -35, 45, -25);
      ctx.stroke();

      // Eyes & Blinking
      blinkPhase = Math.sin(time * 0.5);
      const isBlinking = (blinkPhase > 0.96);

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;

      // Left eye
      ctx.beginPath();
      ctx.ellipse(-26, -10, 14, isBlinking ? 2 : 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Right eye
      ctx.beginPath();
      ctx.ellipse(26, -10, 14, isBlinking ? 2 : 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (!isBlinking) {
        // Iris / Pupil
        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.arc(-26, -10, 5, 0, Math.PI * 2);
        ctx.arc(26, -10, 5, 0, Math.PI * 2);
        ctx.fill();

        // Eye catchlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-24, -12, 2, 0, Math.PI * 2);
        ctx.arc(28, -12, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Nose
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(2, 20);
      ctx.lineTo(-5, 23);
      ctx.stroke();

      // Mouth with Lip-Sync
      if (isSpeaking) {
        const speechMouth = 4 + Math.sin(time * 18) * 8 * (mouthOpen || 0.8);
        ctx.fillStyle = '#881337';
        ctx.beginPath();
        ctx.ellipse(0, 48, 16, Math.max(3, speechMouth), 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Relaxed slight professional smile
        ctx.strokeStyle = '#b91c1c';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 42, 14, 0.2, Math.PI - 0.2);
        ctx.stroke();
      }

      ctx.restore();
      requestAnimationFrame(drawAvatar);
    }

    requestAnimationFrame(drawAvatar);
  </script>
</body>
</html>
